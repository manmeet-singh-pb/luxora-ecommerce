<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - LUXORA</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>

<header>
    <div class="header-container">
        <div class="logo" onclick="window.location.href='index.html'">LUXORA</div>
    </div>
</header>

<div style="max-width:400px;margin:80px auto;padding:20px;background:white;border-radius:8px;">
    <h2>Login</h2>

    <input type="text" id="username" placeholder="Enter Username" style="width:100%;padding:10px;margin:10px 0;">
    <input type="password" id="password" placeholder="Enter Password" style="width:100%;padding:10px;margin:10px 0;">

    <button onclick="login()" class="cta-button" style="width:100%;">Login</button>

    <p id="error" style="color:red;"></p>
</div>

<script>
function login() {
    const username = document.getElementById("username").value;
    const password = document.getElementById("password").value;

    if(username === "" || password === "") {
        document.getElementById("error").textContent = "Fill all fields!";
        return;
    }

    // Fake auth (store user)
    localStorage.setItem("luxora-user", JSON.stringify({ username }));

    alert("Login successful!");
    window.location.href = "index.html";
}
</script>

</body>
</html>
